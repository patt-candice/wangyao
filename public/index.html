<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4ff">
<title>วังยาว • ทะเบียนสิ่งของ ซ่อม ยืมคืน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23a8e8d2'/%3E%3Cpath d='M46 16C26 16 16 28 16 44c0 2 1 4 2 4 6-14 14-20 24-24-8 6-14 13-18 24 18 0 24-14 22-32z' fill='%231f4a42'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js" integrity="sha384-YB/DdIkloKoRpclWB8bNcYXWakt57USgtQPDzvnIDHYU0lasD5eWlXVo1S4ODukY" crossorigin="anonymous"></script>
<script>
  // สำรอง: CDN แรกโหลดไม่ได้ ลอง unpkg (ไฟล์เดียวกัน SRI เดียวกัน) ถ้ายังไม่ได้จะใช้ป๊อปอัปสำรองในหน้า
  if (!window.Swal) document.write('<script src="https://unpkg.com/sweetalert2@11.14.5/dist/sweetalert2.all.min.js" integrity="sha384-YB/DdIkloKoRpclWB8bNcYXWakt57USgtQPDzvnIDHYU0lasD5eWlXVo1S4ODukY" crossorigin="anonymous"><\/script>');
</script>
<style>
:root{
  --ink:#3a3956; --muted:#7a7896; --muted-text:#5f5d7c;
  --mint:#c9f2e3; --mint-ink:#1f7a5c; --mint-chip:#1b6e53;
  --peach:#ffe8d4; --peach-ink:#b4601c; --peach-chip:#8f4a12;
  --lav:#ece4ff; --lav-ink:#6d52c9;
  --sky:#dcefff; --sky-ink:#2f6fa8; --sky-chip:#285f92;
  --pink:#ffe1ec; --pink-ink:#c4456f; --pink-chip:#a3355b;
  --butter:#fff3c6; --butter-chip:#7a5b00;
  --gray:#efeef6; --gray-chip:#55536f;
  --btn:linear-gradient(135deg,#a8e8d2,#a9d6fb); --btn-ink:#1f4a42;
  --card:#ffffffd9; --line:#e6e3f3; --shadow:0 10px 30px -12px rgba(109,82,201,.22),0 2px 6px rgba(109,82,201,.06);
  --r:22px; --focus:0 0 0 4px #d9ccff;
  --side:264px;
}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;font-family:'Prompt',system-ui,sans-serif;font-size:14px;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#fff3f8 0%,#f3f4ff 50%,#ecfbf4 100%) fixed;line-height:1.55}
body::before,body::after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
body::before{top:-18vmax;left:-14vmax;background:radial-gradient(circle,#ffd6e7,transparent 65%)}
body::after{bottom:-20vmax;right:-14vmax;background:radial-gradient(circle,#c9f2e3,transparent 65%)}
a{color:var(--lav-ink)}
h1,h2,h3{margin:0;font-weight:600;color:var(--ink)}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
.muted{color:var(--muted-text)}
.small{font-size:12.5px}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:12px}

/* ปุ่ม */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:14px;border:0;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);font-weight:500;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px -8px rgba(47,111,168,.45);white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(47,111,168,.5)}
.btn:active{transform:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.lav{background:var(--lav);color:#4b3a91;box-shadow:none}
.btn.pink{background:var(--pink);color:var(--pink-chip);box-shadow:none}
.btn.peach{background:var(--peach);color:var(--peach-chip);box-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;border-radius:12px;font-size:13px}
.btn.block{width:100%}
.btn .ico{font-size:16px;line-height:1}
.linkbtn{background:none;border:0;color:var(--lav-ink);cursor:pointer;padding:6px 4px;min-height:36px;text-decoration:underline;text-underline-offset:3px}

/* การ์ด */
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid #ffffffb0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:14px}

/* ฟอร์ม */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--ink)}
.field .help{font-size:12px;color:var(--muted-text)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:border .15s,box-shadow .15s}
textarea.input{min-height:88px;resize:vertical}
.input:focus{outline:none;border-color:#b9a6f3;box-shadow:var(--focus)}
.req::after{content:" *";color:var(--pink-chip)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#6d52c9}

/* ชิป */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.c-mint{background:var(--mint);color:var(--mint-chip)}.c-peach{background:var(--peach);color:var(--peach-chip)}
.c-lav{background:var(--lav);color:var(--lav-ink)}.c-sky{background:var(--sky);color:var(--sky-chip)}
.c-pink{background:var(--pink);color:var(--pink-chip)}.c-butter{background:var(--butter);color:var(--butter-chip)}
.c-gray{background:var(--gray);color:var(--gray-chip)}

/* ตาราง */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;border:1px solid var(--line);background:#fff}
table.t{width:100%;border-collapse:collapse;min-width:640px}
table.t th{background:#f6f3ff;text-align:left;font-weight:500;font-size:13px;padding:10px 12px;color:var(--ink);white-space:nowrap;position:sticky;top:0}
table.t td{padding:10px 12px;border-top:1px solid #f0edf8;vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#faf8ff}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#4b3a91}
.empty{padding:28px;text-align:center;color:var(--muted-text)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* โครงหน้า */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;background:#ffffffcc;backdrop-filter:blur(12px);border-radius:28px;box-shadow:var(--shadow);padding:30px 26px;border:1px solid #fff}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#a8e8d2,#a9d6fb);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 24px -10px rgba(47,111,168,.5)}
.logo svg{width:36px;height:36px}
.login-card h1{text-align:center}
.login-card .sub{text-align:center;color:var(--muted-text);margin:4px 0 20px}
.login-links{display:flex;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
#gbtn{display:flex;justify-content:center;margin-top:12px}

#app{display:flex;min-height:100vh}
#side{width:var(--side);flex:0 0 var(--side);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#ffffff8c;backdrop-filter:blur(10px);border-right:1px solid #ffffffc0;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .logo{width:42px;height:42px;border-radius:14px;margin:0}
.brand .logo svg{width:24px;height:24px}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--muted-text)}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:14px;color:var(--ink);text-decoration:none;margin-bottom:3px;transition:background .15s}
.nav a:hover{background:#f6f3ff}
.nav a.on{background:linear-gradient(135deg,#ece4ff,#dcefff);font-weight:500;box-shadow:inset 0 0 0 1px #fff}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:var(--pink);color:var(--pink-chip);border-radius:999px;font-size:12px;padding:1px 8px;font-weight:600}
.nav .sep{font-size:11.5px;color:var(--muted-text);margin:14px 12px 6px;letter-spacing:.3px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;position:sticky;top:0;z-index:30;background:#ffffffa6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffffc0}
.topbar h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px}
.who .name{font-weight:500}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffe1ec,#ece4ff);display:flex;align-items:center;justify-content:center;font-weight:600;color:#6d52c9}
#menuBtn{display:none}
.statusbar{display:flex;gap:14px;align-items:center;padding:7px 24px;font-size:12.5px;color:var(--muted-text);flex-wrap:wrap}
.statusbar .dot{width:8px;height:8px;border-radius:50%;background:#46c29a;display:inline-block;margin-right:4px}
.statusbar .dot.off{background:#e35d8a}
#page{padding:8px 24px 40px;flex:1}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 16px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#ece4ff,#dcefff);border-color:#fff;font-weight:500}
.tab .n{display:inline-block;margin-left:4px;background:#fff;border-radius:999px;padding:0 7px;font-size:12px}

/* แดชบอร์ด */
.stat{cursor:pointer;transition:transform .15s;border:0;text-align:left;width:100%}
.stat:hover{transform:translateY(-3px)}
.stat .k{font-size:13px;color:var(--muted-text)}
.stat .v{font-size:30px;font-weight:600;line-height:1.2;margin-top:6px}
.stat .ic{float:right;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;border-radius:50%;position:relative;flex:0 0 170px}
.donut::after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:12px;color:var(--muted-text)}
.donut .c b{font-size:22px;color:var(--ink)}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;min-height:32px;padding:0 6px;border-radius:10px;width:100%}
.legend button:hover{background:#f6f3ff}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.bars button{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;width:100%;border:0;background:none;cursor:pointer;min-height:34px;padding:0 4px;border-radius:10px;text-align:left}
.bars button:hover{background:#f6f3ff}
.bars .bar{height:14px;border-radius:8px;background:linear-gradient(90deg,#c3b2f5,#9cc9f2)}
.bars .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid #f0edf8;cursor:pointer;border-radius:10px}
.list-item:first-child{border-top:0}
.list-item:hover{background:#faf8ff}
.list-item .grow{flex:1;min-width:0}

/* โมดอลฟอร์ม */
.modal-back{position:fixed;inset:0;background:rgba(58,57,86,.28);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:24px;box-shadow:0 30px 60px -20px rgba(58,57,86,.35);width:100%;max-width:640px;margin:auto 0;animation:pop .18s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #f0edf8;gap:10px}
.modal-b{padding:18px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap}
.xbtn{width:44px;height:44px;border-radius:14px;border:0;background:#f6f3ff;cursor:pointer;font-size:20px;color:var(--ink)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px}
.kv dt{color:var(--muted-text)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{border-left:3px solid #ece4ff;margin-left:6px;padding-left:14px}
.timeline .ev{position:relative;padding:4px 0 10px}
.timeline .ev::before{content:"";position:absolute;left:-21px;top:9px;width:11px;height:11px;border-radius:50%;background:#c3b2f5;border:2px solid #fff}
.files{display:flex;gap:8px;flex-wrap:wrap}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox svg{width:132px;height:132px;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--line)}
.picker{position:relative}
.picker-row{display:flex;gap:8px}
.picker-res{position:absolute;left:0;right:0;top:48px;background:#fff;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);z-index:5;max-height:280px;overflow:auto}
.picker-res:empty{display:none}
.picker-res button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;min-height:44px;cursor:pointer;border-top:1px solid #f4f2fb}
.picker-res button:hover{background:#f6f3ff}
.picker-sel{margin-top:6px}
.lines td .input{min-height:38px;padding:6px 10px}
video.scan{width:100%;border-radius:16px;background:#222;max-height:50vh}
.toast-fallback{position:fixed;top:16px;right:16px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast-fallback div{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px 16px;border-left:5px solid #a8e8d2}

/* SweetAlert2 ธีมพาสเทล */
.swal2-popup{font-family:'Prompt',sans-serif!important;border-radius:24px!important;color:var(--ink)!important;padding-bottom:1.4em!important}
.swal2-title{color:var(--ink)!important;font-size:1.3em!important;font-weight:600!important}
.swal2-html-container{color:var(--muted-text)!important;font-size:1em!important}
.swal2-styled.swal2-confirm{background:var(--btn)!important;color:var(--btn-ink)!important;border-radius:14px!important;min-height:44px;font-weight:500!important;box-shadow:0 6px 16px -8px rgba(47,111,168,.45)!important}
.swal2-styled.swal2-cancel{background:var(--lav)!important;color:#4b3a91!important;border-radius:14px!important;min-height:44px}
.swal2-styled.swal2-deny{background:var(--pink)!important;color:var(--pink-chip)!important;border-radius:14px!important;min-height:44px}
.swal2-styled:focus{box-shadow:var(--focus)!important}
.swal2-popup.swal-error{background:#fff5f8!important;border:2px solid #ffd0e0}
.swal2-popup.swal-error .swal2-title{color:var(--pink-chip)!important}
.swal2-input,.swal2-textarea,.swal2-select{border-radius:14px!important;border:1px solid var(--line)!important;font-family:'Prompt',sans-serif!important}
.swal2-toast{border-radius:16px!important}
.swal2-loader{border-color:#a9d6fb transparent #a8e8d2 transparent!important}
.busy-sub{font-size:13px;color:var(--peach-chip);min-height:18px}
.swal2-container{z-index:2000!important}
.swal2-container.swal2-backdrop-show{background:rgba(109,82,201,.16)!important;backdrop-filter:blur(2px)}
.fb-back{position:fixed;inset:0;background:rgba(58,57,86,.3);z-index:2500;display:flex;align-items:center;justify-content:center;padding:16px}
.fb-box{background:#fff;border-radius:22px;max-width:420px;width:100%;padding:22px;text-align:center;box-shadow:var(--shadow)}
.fb-box.err{background:#fff5f8}
.fb-box .fb-btns{display:flex;gap:8px;justify-content:center;margin-top:16px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);background:#fffffff2}
  body.nav-open #side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(58,57,86,.25);z-index:35;filter:none;opacity:1;width:auto;height:auto;border-radius:0}
  #menuBtn{display:inline-flex}
  .topbar{padding:10px 16px}.statusbar{padding:6px 16px}#page{padding:6px 16px 32px}
  .who .name,.who .role{display:none}
  .g3,.g2{grid-template-columns:1fr}
}
@media (max-width:600px){
  .g4{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}.kv dt{margin-top:6px}
  .modal-back{padding:0}.modal{border-radius:22px 22px 0 0;margin-top:auto;min-height:60vh}
  .stat .v{font-size:24px}
  .topbar .btn .txt{display:none}
}
@media print{#side,.topbar,.statusbar{display:none}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <div class="login-card">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 4.5C10 4.5 5.5 9.5 5.5 16c0 1 .4 2 .9 2.2 2.4-5.6 5.6-8.2 9.6-9.8-3.2 2.4-5.6 5.3-7.2 9.8 7.6.2 10.4-5.8 9.7-13.7z" fill="#1f4a42"/></svg></div>
    <h1 id="loginTitle">วังยาว</h1>
    <p class="sub" id="loginSub">ทะเบียนสิ่งของ แจ้งซ่อม และยืมคืน</p>
    <div id="loginBody"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side" aria-label="เมนูหลัก">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 4.5C10 4.5 5.5 9.5 5.5 16c0 1 .4 2 .9 2.2 2.4-5.6 5.6-8.2 9.6-9.8-3.2 2.4-5.6 5.3-7.2 9.8 7.6.2 10.4-5.8 9.7-13.7z" fill="#1f4a42"/></svg></div>
      <div><b id="bizName">วังยาว</b><span>ทะเบียนสิ่งของและงานซ่อม</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div id="main">
    <header class="topbar">
      <button class="btn ghost sm" id="menuBtn" aria-label="เปิดเมนู">☰</button>
      <h1 id="pageTitle">ภาพรวม</h1>
      <div class="who">
        <div class="avatar" id="avatar">ว</div>
        <div><div class="name" id="meName"></div><div class="role small muted" id="meRole"></div></div>
      </div>
      <button class="btn ghost sm" data-act="change-password" title="เปลี่ยนรหัสผ่าน"><span class="ico">🔑</span><span class="txt">เปลี่ยนรหัสผ่าน</span></button>

async function act(action, payload, o = {}) {
  const requestId = rid();
  busy(o.loading || 'กำลังบันทึกข้อมูล…');
  try {
    const r = await API.api(action, payload, requestId);

/* ---------------------------------------------------------------- ไฟล์: บีบอัดภาพ + อัปโหลดแบบแบ่งส่วน */
const PART = 2500000;

  const maxPx = num(S.settings.imageMaxPx) || 1440, target = (num(S.settings.imageTargetKB) || 250) * 1024, hard = 512 * 1024;

  for (let i = 0; i < 12; i++) {

    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const b = await new Promise((r) => cv.toBlob(r, 'image/jpeg', q));
    best = b;
    if (b.size <= target) break;
    if (q > 0.62) q -= 0.08; else { edge = Math.round(edge * 0.82); q = 0.8; }
    if (edge < 480 && b.size <= hard) break;
  }
  if (!best || best.size > hard) throw new Error('บีบอัดภาพให้เล็กกว่า 512 KB ไม่ได้');
  return new File([best], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
}

  const out = [];
  for (const f of list) {
    if (/^image\//.test(f.type)) out.push(await compressImage(f));
    else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) { if (f.size > 5 * 1024 * 1024) throw new Error(`ไฟล์ ${f.name} ใหญ่เกิน 5 MB`); out.push(f); }
    else throw new Error(`ไฟล์ ${f.name} ไม่รองรับ (ภาพหรือ PDF เท่านั้น)`);
  }

}
async function uploadFile(entity, entityId, file) {
  const parts = Math.max(1, Math.ceil(file.size / PART)), uploadId = rid() + rid().slice(0, 8);

}

function tableHtml(cols, rows, numCols) {

}
function downloadCsv(name, cols, rows) {
  const cell = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = '﻿' + [cols].concat(rows).map((r) => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name + '_' + todayStr() + '.csv';

const PAGES = {};

function parseHash() { const h = location.hash.replace(/^#\/?/, '') || 'dashboard'; const [p, q] = h.split('?'); return { page: p || 'dashboard', q: new URLSearchParams(q || '') }; }
function go(path) { if (location.hash === '#/' + path) render(); else location.hash = '#/' + path; document.body.classList.remove('nav-open'); }
function updateQuery(patch, keepPage) {

  if (!keepPage && !('page' in patch)) q.delete('page');

/* ================================================================ งานที่ต้องตัดสินใจ / ติดตาม */
function decisionItems() {
  return memo('decisions', () => {
    const p = P(), me = S.me ? S.me.id : '', out = [];
    if (p.admin) {
      T('Repairs').filter((r) => r.status === 'APPROVAL').forEach((r) => out.push({ k: 'repairApproval', id: r.id, t: `อนุมัติงานซ่อม ${r.code}`, s: assetLabel(byId('Assets', r.asset)) }));
      T('BudgetRevisions').filter((b) => b.status === 'PENDING').forEach((b) => { const r = byId('Repairs', b.repair); out.push({ k: 'budget', id: b.id, t: `ขอแก้ไขวงเงิน ${r ? r.code : ''}`, s: b.reason }); });
      T('Disposals').filter((d) => d.status === 'PENDING').forEach((d) => out.push({ k: 'disposal', id: d.id, t: `อนุมัติจำหน่าย ${d.code}`, s: assetLabel(byId('Assets', d.disposedAsset)) }));
      T('Users').filter((u) => u.status === 'PENDING').forEach((u) => out.push({ k: 'user', id: u.id, t: `ผู้สมัครใหม่: ${u.name}`, s: u.department || '' }));
    }
    if (p.inspect) T('Repairs').filter((r) => r.status === 'ACCEPT').forEach((r) => out.push({ k: 'accept', id: r.id, t: `ตรวจรับงานซ่อม ${r.code}`, s: assetLabel(byId('Assets', r.asset)) }));
    return out.concat(myWork().filter((x) => !out.some((o) => o.id === x.id)));
  });
}
function myWork() {
  const p = P(), me = S.me.id, out = [];
  T('Repairs').forEach((r) => {
    if (r.assigned === me && (r.status === 'ASSESS' || r.status === 'REPAIR')) out.push({ k: 'myRepair', id: r.id, t: `${r.status === 'ASSESS' ? 'ประเมินงานซ่อม' : 'ดำเนินการซ่อม'} ${r.code}`, s: assetLabel(byId('Assets', r.asset)) });
    else if (p.assign && !r.assigned && isOpenRepair(r)) out.push({ k: 'assign', id: r.id, t: `มอบหมายช่าง ${r.code}`, s: r.issue });
  });
  return out;
}
function followItems() {
  return memo('follow', () => {
    const out = [], today = todayStr(), lim = addDays(num(S.settings.dueAlertDays) || 3);
    T('Loans').forEach((l) => {
      if (l.status === 'RETURNED' || !l.due) return;
      if (l.due < today) out.push({ k: 'loan', id: l.id, t: `เกินกำหนดคืน ${l.code}`, s: `${l.borrower} • กำหนด ${fmtD(l.due)}`, c: 'pink' });
      else if (l.due <= lim) out.push({ k: 'loan', id: l.id, t: `ใกล้ครบกำหนดคืน ${l.code}`, s: `${l.borrower} • กำหนด ${fmtD(l.due)}`, c: 'peach' });
    });
    T('Repairs').forEach((r) => { if (isOpenRepair(r) && r.due && r.due < today) out.push({ k: 'repair', id: r.id, t: `งานซ่อมเกินกำหนด ${r.code}`, s: `${uname(r.assigned)} • กำหนด ${fmtD(r.due)}`, c: 'pink' }); });
    T('Repairs').forEach((r) => { if (r.owner === S.me.id && ['ASSESS', 'APPROVAL', 'REPAIR', 'ACCEPT'].includes(r.status)) out.push({ k: 'repair', id: r.id, t: `งานที่ฉันแจ้ง ${r.code}`, s: (RST[r.status] || [''])[0], c: 'sky' }); });
    return out;
  });
}
function itemList(items, emptyText) {

    if (fin) data.push(['', 'รวม', '', '', '', rows.reduce((s, a) => s + num(a.qty), 0), '', '', '', '', '', '', money(rows.reduce((s, a) => s + num(a.price) * num(a.qty), 0))]);
    return { cols, rows: data, num: fin ? [5, 11, 12] : [5] };
  }
  if (type === 'repairs') {
    const rows = T('Repairs').filter((r) => inMonth(r.created));
    return { cols: ['รหัส', 'วันที่แจ้ง', 'สิ่งของ', 'อาการ', 'ช่าง', 'สถานะ', 'กำหนดเสร็จ'].concat(fin ? ['วงเงิน', 'ค่าใช้จ่ายจริง'] : []),
      rows: rows.map((r) => { const a = byId('Assets', r.asset); return [r.code, fmtD(r.created), a ? a.name + ' (' + a.code + ')' : '', r.issue, uname(r.assigned), RST[r.status][0], fmtD(r.due)].concat(fin ? [money(r.approved), money(repairCost(r.id))] : []); }), num: fin ? [7, 8] : [] };
  }
  if (type === 'budget') {

    const data = rows.map((r) => { const a = byId('Assets', r.asset), c = repairCost(r.id); return [r.code, fmtD(r.created), a ? a.name : '', RST[r.status][0], money(r.approved), money(c), money(num(r.approved) - c)]; });

    return { cols: ['รหัส', 'วันที่แจ้ง', 'สิ่งของ', 'สถานะ', 'วงเงินอนุมัติ', 'ค่าใช้จ่ายจริง', 'คงเหลือ/เกิน'], rows: data, num: [4, 5, 6] };
  }
  if (type === 'loans') {
    const rows = T('Loans').filter((l) => inMonth(l.start));
    return { cols: ['เลขที่', 'ผู้ยืม', 'เบอร์โทร', 'วันยืม', 'กำหนดคืน', 'จำนวนรายการ', 'ยืม (หน่วย)', 'คืนแล้ว', 'สถานะ'],

  }

    return { cols: ['เลขที่', 'วันที่เสนอ', 'สิ่งของ', 'จำนวน', 'เหตุผล', 'ผู้เสนอ', 'สถานะ', 'ผู้อนุมัติ', 'วันที่พิจารณา'],
      rows: rows.map((d) => { const a = byId('Assets', d.disposedAsset); return [d.code, fmtD(d.created), a ? a.name + ' (' + a.code + ')' : '', num(d.qty), optLabel('reasons', d.reason), uname(d.owner), DST[d.status][0], d.approvedBy ? uname(d.approvedBy) : '', fmtD(d.approvedAt)]; }), num: [3] };

}

let publicCfg = null;
function showLogin(mode, token) {
  stopPolling();
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  document.title = 'เข้าสู่ระบบ • วังยาว';
  const body = $('#loginBody');
  const cfg = publicCfg || {};
  if (cfg.businessName) $('#loginTitle').textContent = cfg.businessName;
  if (mode === 'register') {
    $('#loginSub').textContent = 'สมัครสมาชิก (ผู้ดูแลต้องอนุมัติก่อนใช้งาน)';
    body.innerHTML = `<form id="regForm" class="stack" novalidate>${fieldHtml({ idp: 'l_', name: 'name', label: 'ชื่อ-นามสกุล', required: true })}${fieldHtml({ idp: 'l_', name: 'email', label: 'อีเมล', type: 'email', attrs: 'autocomplete="email"' })}
      ${fieldHtml({ idp: 'l_', name: 'phone', label: 'เบอร์โทร', type: 'tel', attrs: 'autocomplete="tel"' })}${fieldHtml({ idp: 'l_', name: 'department', label: 'แผนก', type: 'select', options: (cfg.departments || []).map((d) => [d, d]) })}
      ${fieldHtml({ idp: 'l_', name: 'password', label: 'รหัสผ่าน', type: 'password', required: true, attrs: 'autocomplete="new-password"', help: 'อย่างน้อย 8 ตัว มีทั้งตัวเลขและตัวอักษร' })}${fieldHtml({ idp: 'l_', name: 'password2', label: 'ยืนยันรหัสผ่าน', type: 'password', required: true, attrs: 'autocomplete="new-password"' })}
      <button class="btn block" type="submit">สมัครสมาชิก</button><button class="linkbtn" type="button" data-login="login">← กลับไปหน้าเข้าสู่ระบบ</button></form>`;
    $('#l_department').closest('.field').classList.toggle('hidden', !(cfg.departments || []).length);
  } else if (mode === 'forgot') {
    $('#loginSub').textContent = 'ลืมรหัสผ่าน';
    body.innerHTML = `<form id="forgotForm" class="stack" novalidate><p class="muted small">กรอกอีเมลหรือเบอร์โทรที่ใช้สมัคร ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมล (ใช้ได้ครั้งเดียว ภายใน 15 นาที)</p>
      ${fieldHtml({ idp: 'l_', name: 'identifier', label: 'อีเมลหรือเบอร์โทร', required: true, attrs: 'autocomplete="username"' })}<button class="btn block" type="submit">ส่งลิงก์ตั้งรหัสผ่าน</button><button class="linkbtn" type="button" data-login="login">← กลับไปหน้าเข้าสู่ระบบ</button></form>`;
  } else if (mode === 'reset') {
    $('#loginSub').textContent = 'ตั้งรหัสผ่านใหม่';
    body.innerHTML = `<form id="resetForm" class="stack" novalidate data-token="${esc(token)}">${fieldHtml({ idp: 'l_', name: 'password', label: 'รหัสผ่านใหม่', type: 'password', required: true, attrs: 'autocomplete="new-password"', help: 'อย่างน้อย 8 ตัว มีทั้งตัวเลขและตัวอักษร' })}
      ${fieldHtml({ idp: 'l_', name: 'password2', label: 'ยืนยันรหัสผ่านใหม่', type: 'password', required: true, attrs: 'autocomplete="new-password"' })}<button class="btn block" type="submit">ตั้งรหัสผ่านใหม่</button><button class="linkbtn" type="button" data-login="login">← กลับไปหน้าเข้าสู่ระบบ</button></form>`;
  } else {
    $('#loginSub').textContent = 'ทะเบียนสิ่งของ แจ้งซ่อม และยืมคืน';
    body.innerHTML = `<form id="loginForm" class="stack" novalidate>${fieldHtml({ idp: 'l_', name: 'identifier', label: 'อีเมลหรือเบอร์โทร', required: true, attrs: 'autocomplete="username" inputmode="email"' })}
      ${fieldHtml({ idp: 'l_', name: 'password', label: 'รหัสผ่าน', type: 'password', required: true, attrs: 'autocomplete="current-password"' })}<button class="btn block" type="submit">เข้าสู่ระบบ</button></form>
      <div id="gbtn"></div><div class="login-links">${cfg.allowRegister === false ? '<span></span>' : '<button class="linkbtn" type="button" data-login="register">สมัครสมาชิก</button>'}<button class="linkbtn" type="button" data-login="forgot">ลืมรหัสผ่าน?</button></div>`;
    setupGoogle();
  }
  if (!publicCfg) API.call('ping').then((d) => { publicCfg = Object.assign({}, d.config || {}); if (!$('#app').classList.contains('hidden')) return; if (publicCfg.businessName) $('#loginTitle').textContent = publicCfg.businessName; if (mode !== 'reset' && mode !== 'forgot' && mode !== 'register') showLogin(mode); }).catch(() => { publicCfg = {}; });
}
function setupGoogle() {
  const g = publicCfg && publicCfg.googleLogin;
  if (!g || !g.enabled || !g.clientId) return;
  const init = () => {
    if (!window.google || !google.accounts) return;
    google.accounts.id.initialize({ client_id: g.clientId, callback: (r) => loginWith('loginGoogle', { credential: r.credential }) });
    const el = $('#gbtn'); if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'th' });
  };
  if (window.google && google.accounts) return init();
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = init; document.head.appendChild(s);
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-login]'); if (b) showLogin(b.dataset.login); });
async function loginWith(method, payload) {
  busy('กำลังตรวจบัญชี…');
  try {
    const d = await API.call(method, payload);
    busyStep('เข้าสู่ระบบสำเร็จ กำลังโหลดข้อมูล…');
    API.setToken(d.token);
    applyState(d.state);
    clearTimeout(busyTimer); Swal.close();
    enterApp();
    toast('ยินดีต้อนรับ ' + d.user.name);
  } catch (e) { failBox(e); }
}
document.addEventListener('submit', async (e) => {
  const f = e.target, v = () => readForm(f);
  if (f.id === 'loginForm') {
    e.preventDefault(); const x = v();
    if (!x.identifier || !x.password) return toast('กรุณากรอกอีเมล/เบอร์โทร และรหัสผ่าน', 'warning');
    return loginWith('login', x);
  }
  if (f.id === 'regForm') {
    e.preventDefault(); const x = v();
    if (!x.name || !x.password) return toast('กรุณากรอกข้อมูลให้ครบ', 'warning');
    if (!x.email && !x.phone) return toast('กรุณากรอกอีเมลหรือเบอร์โทร', 'warning');
    if (x.password !== x.password2) return toast('รหัสผ่านสองช่องไม่ตรงกัน', 'warning');
    busy('กำลังส่งใบสมัคร…');
    try { await API.call('register', x); await done('สมัครสมาชิกเรียบร้อย กรุณารอผู้ดูแลอนุมัติ'); showLogin('login'); } catch (err) { failBox(err); }
  }
  if (f.id === 'forgotForm') {
    e.preventDefault(); const x = v();
    if (!x.identifier) return toast('กรุณากรอกอีเมลหรือเบอร์โทร', 'warning');
    busy('กำลังส่งลิงก์…');
    try { const d = await API.call('requestPasswordReset', x); clearTimeout(busyTimer); await Swal.fire({ icon: 'success', title: 'ส่งคำขอแล้ว', text: d.message, confirmButtonText: 'ตกลง' }); showLogin('login'); } catch (err) { failBox(err); }
  }
  if (f.id === 'resetForm') {
    e.preventDefault(); const x = v();
    if (x.password !== x.password2) return toast('รหัสผ่านสองช่องไม่ตรงกัน', 'warning');
    busy('กำลังตั้งรหัสผ่านใหม่…');
    try { await API.call('resetPassword', { token: f.dataset.token, password: x.password }); await done('ตั้งรหัสผ่านใหม่เรียบร้อย'); showLogin('login'); } catch (err) { failBox(err); }
  }
});
function changePassword(force) {
  openForm({
    title: force ? 'กรุณาเปลี่ยนรหัสผ่านชั่วคราว' : 'เปลี่ยนรหัสผ่าน', locked: force,
    before: force ? '<p class="muted">บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน</p>' : '',
    fields: [{ name: 'current', label: 'รหัสผ่านปัจจุบัน', type: 'password', required: true, full: true, attrs: 'autocomplete="current-password"' },
      { name: 'next', label: 'รหัสผ่านใหม่', type: 'password', required: true, attrs: 'autocomplete="new-password"', help: 'อย่างน้อย 8 ตัว มีทั้งตัวเลขและตัวอักษร' },
      { name: 'next2', label: 'ยืนยันรหัสผ่านใหม่', type: 'password', required: true, attrs: 'autocomplete="new-password"' }],
    submitText: 'เปลี่ยนรหัสผ่าน',
    onSubmit: (v) => {
      if (v.next !== v.next2) return toast('รหัสผ่านใหม่สองช่องไม่ตรงกัน', 'warning');
      if (v.next.length < 8) return toast('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร', 'warning');
      return act('changePassword', { current: v.current, next: v.next }, { success: 'เปลี่ยนรหัสผ่านเรียบร้อย' });
    }
  });
  if (force) $('#modalRoot .modal-f').insertAdjacentHTML('afterbegin', '<button class="btn lav" type="button" data-act="logout">ออกจากระบบ</button>');
}
async function logout(skipConfirm) {
  if (!skipConfirm) { const c = await confirmBox('ออกจากระบบ?', 'คุณต้องเข้าสู่ระบบใหม่เพื่อใช้งานต่อ', { confirmText: 'ออกจากระบบ' }); if (!c.ok) return; }
  const t = API.token;
  API.setToken(''); closeModal(); S.me = null; S.t = {}; S.rev = '';
  showLogin('login');
  toast('ออกจากระบบแล้ว', 'info');
  if (t) API.post({ method: 'logout', token: t, payload: {} }).catch(() => { });
}
function sessionExpired(msg) {
  stopPolling();
  API.setToken(''); closeModal(); S.me = null; S.rev = '';
  return Swal.fire({ icon: 'warning', title: 'เซสชันหมดอายุ', text: msg || 'กรุณาเข้าสู่ระบบใหม่', confirmButtonText: 'เข้าสู่ระบบ', allowOutsideClick: false }).then(() => showLogin('login'));
}

/* ================================================================ รีเฟรช / poll / ออนไลน์ */
let pollTimer = null;
async function refresh(manual) {
  if (!API.token) return;
  try {
    const r = await API.post({ method: 'api', token: API.token, action: 'getState', payload: {}, rev: S.rev });
    if (r.unchanged) { S.at = new Date(); updateChrome(); }
    else { applyState(r.state); if (!modalOpen()) render(true); }
    if (manual) toast('อัปเดตข้อมูลล่าสุดแล้ว');
  } catch (e) { if (manual || e.code === 'E_AUTH') failBox(e); }
}
function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => {
    if (document.visibilityState !== 'visible' || modalOpen() || (Swal.isVisible && Swal.isVisible()) || !navigator.onLine) return;
    refresh(false);
  }, 120000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
function setNet(on) { const d = $('#netDot'), t = $('#netText'); if (d) d.classList.toggle('off', !on); if (t) t.textContent = on ? 'ออนไลน์' : 'ออฟไลน์'; }
window.addEventListener('offline', () => { setNet(false); toast('อินเทอร์เน็ตหลุด การบันทึกจะทำไม่ได้จนกว่าจะกลับมา', 'warning'); });
window.addEventListener('online', () => { setNet(true); toast('อินเทอร์เน็ตกลับมาแล้ว'); refresh(false); });

/* ================================================================ เริ่มต้น */
function enterApp() {
  $('#loginBody').innerHTML = '';
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/dashboard');
  updateChrome(); render();
  setNet(navigator.onLine);
  startPolling();
  const dl = safeJson(sessionStorage.getItem('wy_deeplink'));
  if (dl) { sessionStorage.removeItem('wy_deeplink'); if (dl.asset) showAsset(dl.asset); else if (dl.location) go('assets?loc=' + encodeURIComponent(dl.location)); }
  if (S.me && S.me.mustChangePassword) changePassword(true);
}
(async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('asset') || params.get('location')) sessionStorage.setItem('wy_deeplink', JSON.stringify({ asset: params.get('asset'), location: params.get('location') }));
  const reset = params.get('reset');
  if ([...params.keys()].length) history.replaceState(null, '', location.pathname + location.hash);
  if (reset) return showLogin('reset', reset);
  if (!API.token) return showLogin('login');
  try {
    const r = await API.post({ method: 'api', token: API.token, action: 'getState', payload: {} });
    applyState(r.state); enterApp();
  } catch (e) {
    API.setToken('');
    showLogin('login');
    if (e.code !== 'E_AUTH') failBox(e);
  }
})();
